[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dialogue-retrieval"
version = "0.3.0"
description = "Audio-first, fingerprint-deduplicated video dialogue retrieval and frame localization pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DeepMind Agentic Engineering" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "yt-dlp>=2023.12.30",
    "faster-whisper>=0.10.0",
    "rapidfuzz>=3.0.0",
    "pyacoustid>=1.2.0",
    "tabulate>=0.9.0",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=2.2.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pandas>=2.0.0",
    "Pillow>=9.5.0",
    "torch>=2.0.0",
]

[project.scripts]
video-dialogue = "video_dialogue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
